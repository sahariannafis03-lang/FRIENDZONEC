<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendzone - Connect. Friend. Share.</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Standalone) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (to compile JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            margin: 0;
        }
        
        /* Particles & Background */
        .bg-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(147, 51, 234, 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Neon Glows */
        .neon-gold {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 0 10px rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.6);
        }
        .neon-blue {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.6);
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        
        /* Floating animation for hero */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG Icons Components
        const Crown = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="gold" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>;
        const Users = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>;
        const MessageSquare = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>;
        const Shield = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
        const Image = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
        const Mic = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>;
        const Trash2 = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const UserMinus = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="23" y1="11" x2="17" y2="11"></line></svg>;

        const App = () => {
            const [activeTab, setActiveTab] = useState('Home');
            const [currentUser, setCurrentUser] = useState(null);
            const [members, setMembers] = useState([]);
            const [posts, setPosts] = useState([]);
            const [chatMessages, setChatMessages] = useState([]);
            
            // Join Form States
            const [joinName, setJoinName] = useState('');
            const [joinAge, setJoinAge] = useState('');
            const [joinGender, setJoinGender] = useState('Male');

            // Post & Chat States
            const [postContent, setPostContent] = useState('');
            const [chatInput, setChatInput] = useState('');
            
            // Admin States
            const [adminPassword, setAdminPassword] = useState('');
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

            // 15 Min Auto-delete logic for Chat (if >= 4 members)
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = Date.now();
                    setChatMessages(prev => {
                        if (members.length >= 4) {
                            return prev.filter(msg => now - msg.timestamp < 15 * 60 * 1000);
                        }
                        return prev;
                    });
                }, 60000); // Check every minute
                return () => clearInterval(interval);
            }, [members.length]);

            // Time Restriction Logic (6 PM to 11 PM)
            const currentHour = new Date().getHours();
            const isChatOpen = currentHour >= 18 && currentHour < 23;

            // Developers Data
            const developers = [
                { id: 1, name: 'NABIL', age: 14, role: 'Founder & Lead Developer', cls: 'Six (6)', sec: 'E/V', school: 'Motijheel Model School and College', highlight: 'gold' },
                { id: 2, name: 'ARAFAT', age: 14, role: 'UI/UX Developer', cls: 'Six (6)', sec: 'E/V', school: 'Motijheel Model School and College', highlight: 'blue' },
                { id: 3, name: 'MUBIN', age: 13, role: 'Frontend Developer', cls: 'Six (6)', sec: 'E/V', school: 'Motijheel Model School and College' },
                { id: 4, name: 'SHUVOM', age: 13, role: 'Backend Developer', cls: 'Six (6)', sec: 'E/V', school: 'Motijheel Model School and College' },
                { id: 5, name: 'ALIF', age: 13, role: 'Creative Developer', cls: 'Six (6)', sec: 'E/V', school: 'Motijheel Model School and College' }
            ];

            const handleJoin = (e) => {
                e.preventDefault();
                if(!joinName || !joinAge) return;
                
                const newMember = {
                    id: Date.now(),
                    name: joinName,
                    age: joinAge,
                    gender: joinGender,
                    avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${joinName}&gender=${joinGender.toLowerCase()}`
                };
                
                setMembers([newMember, ...members]);
                setCurrentUser(newMember);
                setJoinName('');
                setJoinAge('');
            };

            const handlePost = () => {
                if(!postContent.trim()) return;
                const newPost = {
                    id: Date.now(),
                    author: currentUser.name,
                    authorId: currentUser.id,
                    avatar: currentUser.avatar,
                    content: postContent,
                    timestamp: new Date().toLocaleString(),
                    type: 'text'
                };
                setPosts([newPost, ...posts]);
                setPostContent('');
            };

            const handleChat = (e) => {
                e.preventDefault();
                if(!chatInput.trim()) return;
                const newMsg = {
                    id: Date.now(),
                    author: currentUser.name,
                    content: chatInput,
                    timestamp: Date.now()
                };
                setChatMessages([...chatMessages, newMsg]);
                setChatInput('');
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if(adminPassword === '5566') {
                    setIsAdminLoggedIn(true);
                } else {
                    alert('Wrong Admin Password!');
                }
                setAdminPassword('');
            };

            const deletePost = (id) => setPosts(posts.filter(p => p.id !== id));
            const kickMember = (id) => {
                setMembers(members.filter(m => m.id !== id));
                if(currentUser && currentUser.id === id) setCurrentUser(null);
            };

            return (
                <div>
                    <div className="bg-particles"></div>
                    
                    {/* Navigation */}
                    <nav className="glass sticky top-0 z-50 px-4 py-3 flex flex-wrap justify-between items-center border-b border-gray-800">
                        <div className="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-600 tracking-wider">
                            FRIENDZONE
                        </div>
                        <div className="flex gap-2 sm:gap-6 mt-3 sm:mt-0 overflow-x-auto">
                            {['Home', 'Community', 'Admin'].map(tab => (
                                <button 
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`px-4 py-2 rounded-full text-sm font-semibold transition-all ${activeTab === tab ? 'bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.5)]' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
                                >
                                    {tab === 'Home' && <Users className="inline-block mr-2 w-4 h-4"/>}
                                    {tab === 'Community' && <MessageSquare className="inline-block mr-2 w-4 h-4"/>}
                                    {tab === 'Admin' && <Shield className="inline-block mr-2 w-4 h-4"/>}
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <div className="max-w-6xl mx-auto p-4 pt-10 pb-20">
                        
                        {/* --- HOME TAB --- */}
                        {activeTab === 'Home' && (
                            <div className="space-y-20 animate-float" style={{animation: 'none'}}>
                                
                                {/* Hero Section */}
                                <div className="text-center space-y-6">
                                    <h1 className="text-5xl md:text-7xl font-black text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]">
                                        WELCOME TO <span className="bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-500">FRIENDZONE</span>
                                    </h1>
                                    <p className="text-xl md:text-2xl text-gray-400 font-light tracking-wide">YOUR WORLD. YOUR FRIENDS. YOUR COMMUNITY.</p>
                                </div>

                                {/* Developers Section */}
                                <div className="space-y-8">
                                    <h2 className="text-3xl font-bold text-center border-b border-gray-800 pb-4 inline-block mx-auto">MEET THE DEVELOPERS</h2>
                                    
                                    {/* VIP Developers (Nabil & Arafat) */}
                                    <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                                        {developers.slice(0,2).map(dev => (
                                            <div key={dev.id} className={`glass p-6 rounded-2xl relative transform transition-all hover:scale-105 ${dev.highlight === 'gold' ? 'neon-gold' : 'neon-blue'}`}>
                                                {dev.highlight === 'gold' && (
                                                    <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-black rounded-full p-2">
                                                        <Crown />
                                                    </div>
                                                )}
                                                <div className="text-center">
                                                    <h3 className={`text-2xl font-bold ${dev.highlight === 'gold' ? 'text-yellow-400' : 'text-cyan-400'}`}>{dev.name}</h3>
                                                    <p className="text-sm font-semibold tracking-widest text-gray-300 mt-1">{dev.role}</p>
                                                    <div className="mt-4 text-sm text-gray-400 space-y-1">
                                                        <p>Age: {dev.age}</p>
                                                        <p>Class: {dev.cls} | Sec: {dev.sec}</p>
                                                        <p className="text-xs mt-2 text-gray-500">{dev.school}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Other Developers */}
                                    <div className="grid md:grid-cols-3 gap-6 max-w-5xl mx-auto mt-8">
                                        {developers.slice(2).map(dev => (
                                            <div key={dev.id} className="glass p-5 rounded-xl text-center transform transition-all hover:-translate-y-2 border border-gray-700">
                                                <h3 className="text-xl font-bold text-white">{dev.name}</h3>
                                                <p className="text-sm text-blue-400 mt-1">{dev.role}</p>
                                                <div className="mt-3 text-xs text-gray-400 space-y-1">
                                                    <p>Age: {dev.age}</p>
                                                    <p>Class: {dev.cls} | Sec: {dev.sec}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Join Community Section */}
                                <div className="grid md:grid-cols-2 gap-10 bg-black/40 p-8 rounded-3xl border border-gray-800">
                                    {/* Join Form */}
                                    <div>
                                        <h2 className="text-2xl font-bold mb-6 flex items-center gap-3">
                                            <Users className="text-blue-500"/> Join The Community
                                        </h2>
                                        {currentUser ? (
                                            <div className="glass p-6 rounded-2xl text-center border-green-500/50">
                                                <img src={currentUser.avatar} alt="avatar" className="w-24 h-24 mx-auto bg-gray-800 rounded-full mb-4" />
                                                <h3 className="text-2xl font-bold text-green-400">Welcome, {currentUser.name}!</h3>
                                                <p className="text-gray-400">You are now a verified member.</p>
                                            </div>
                                        ) : (
                                            <form onSubmit={handleJoin} className="space-y-4">
                                                <div>
                                                    <label className="text-sm text-gray-400 mb-1 block">Full Name</label>
                                                    <input type="text" required value={joinName} onChange={e=>setJoinName(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" placeholder="Your Name" />
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-sm text-gray-400 mb-1 block">Age</label>
                                                        <input type="number" required value={joinAge} onChange={e=>setJoinAge(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" placeholder="Age" />
                                                    </div>
                                                    <div>
                                                        <label className="text-sm text-gray-400 mb-1 block">Gender</label>
                                                        <select value={joinGender} onChange={e=>setJoinGender(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none">
                                                            <option>Male</option>
                                                            <option>Female</option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-purple-600 py-3 rounded-lg font-bold hover:shadow-[0_0_20px_rgba(99,102,241,0.4)] transition-all mt-4">
                                                    Join Friendzone
                                                </button>
                                            </form>
                                        )}
                                    </div>

                                    {/* Member List */}
                                    <div className="glass p-6 rounded-2xl flex flex-col h-[400px]">
                                        <div className="flex justify-between items-center mb-4 pb-4 border-b border-gray-800">
                                            <h3 className="font-bold text-lg">New Members</h3>
                                            <span className="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                                {members.length + 5} Online
                                            </span>
                                        </div>
                                        <div className="overflow-y-auto custom-scrollbar pr-2 space-y-3 flex-1">
                                            {members.length === 0 && <p className="text-gray-500 text-center mt-10">No new members yet. Be the first!</p>}
                                            {members.map(member => (
                                                <div key={member.id} className="flex items-center gap-3 bg-gray-900/50 p-3 rounded-xl border border-gray-800">
                                                    <img src={member.avatar} alt="avatar" className="w-10 h-10 rounded-full bg-gray-800" />
                                                    <div>
                                                        <p className="font-bold text-sm text-white">{member.name}</p>
                                                        <p className="text-xs text-gray-500">{member.age} yrs • {member.gender}</p>
                                                    </div>
                                                </div>
                                            ))}
                                            {/* Dummy Members */}
                                            {developers.map(dev => (
                                                <div key={'dev'+dev.id} className="flex items-center gap-3 bg-gray-900/50 p-3 rounded-xl border border-gray-800">
                                                    <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center font-bold text-xs">{dev.name.substring(0,2)}</div>
                                                    <div>
                                                        <p className="font-bold text-sm text-white">{dev.name}</p>
                                                        <p className="text-xs text-blue-400">{dev.role}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- COMMUNITY TAB --- */}
                        {activeTab === 'Community' && (
                            <div>
                                {!currentUser ? (
                                    <div className="text-center py-20">
                                        <Shield className="w-20 h-20 mx-auto text-gray-600 mb-4"/>
                                        <h2 className="text-3xl font-bold mb-4">Access Denied</h2>
                                        <p className="text-gray-400 mb-6">You must join Friendzone from the Home tab to access the Community.</p>
                                        <button onClick={() => setActiveTab('Home')} className="bg-blue-600 px-6 py-2 rounded-lg font-bold">Go to Home</button>
                                    </div>
                                ) : (
                                    <div className="grid lg:grid-cols-3 gap-6">
                                        
                                        {/* Feed Section (2/3 width) */}
                                        <div className="lg:col-span-2 space-y-6">
                                            {/* Create Post */}
                                            <div className="glass p-5 rounded-2xl">
                                                <div className="flex gap-3">
                                                    <img src={currentUser.avatar} className="w-12 h-12 rounded-full bg-gray-800" />
                                                    <div className="flex-1">
                                                        <textarea 
                                                            value={postContent}
                                                            onChange={e=>setPostContent(e.target.value)}
                                                            className="w-full bg-gray-900/50 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 resize-none"
                                                            rows="3"
                                                            placeholder={`What's on your mind, ${currentUser.name}?`}
                                                        ></textarea>
                                                        <div className="flex justify-between items-center mt-3">
                                                            <div className="flex gap-2 text-gray-400">
                                                                <button className="p-2 hover:bg-gray-800 rounded-lg transition-colors" title="Add Photo"><Image/></button>
                                                                <button className="p-2 hover:bg-gray-800 rounded-lg transition-colors" title="Record Voice"><Mic/></button>
                                                            </div>
                                                            <button onClick={handlePost} className="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-bold transition-colors">Post</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Posts Feed */}
                                            <div className="space-y-4">
                                                {posts.map(post => (
                                                    <div key={post.id} className="glass p-5 rounded-2xl">
                                                        <div className="flex justify-between items-start mb-3">
                                                            <div className="flex gap-3 items-center">
                                                                <img src={post.avatar} className="w-10 h-10 rounded-full bg-gray-800"/>
                                                                <div>
                                                                    <p className="font-bold">{post.author}</p>
                                                                    <p className="text-xs text-gray-500">{post.timestamp}</p>
                                                                </div>
                                                            </div>
                                                            {post.authorId === currentUser.id && (
                                                                <button onClick={() => deletePost(post.id)} className="text-red-400 hover:text-red-300 p-2"><Trash2/></button>
                                                            )}
                                                        </div>
                                                        <p className="text-gray-200 whitespace-pre-wrap">{post.content}</p>
                                                    </div>
                                                ))}
                                                {posts.length === 0 && <p className="text-center text-gray-500 py-10">No posts yet. Be the first to post!</p>}
                                            </div>
                                        </div>

                                        {/* Global Live Chat (1/3 width) */}
                                        <div className="glass rounded-2xl flex flex-col h-[600px] sticky top-24">
                                            <div className="p-4 border-b border-gray-800 bg-gray-900/50 rounded-t-2xl">
                                                <h3 className="font-bold flex items-center justify-between">
                                                    <span>Global Live Chat</span>
                                                    <span className={`text-xs px-2 py-1 rounded-full ${isChatOpen ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`}>
                                                        {isChatOpen ? 'Online' : 'Closed'}
                                                    </span>
                                                </h3>
                                                <p className="text-xs text-gray-400 mt-1">Open: 6:00 PM - 11:00 PM</p>
                                                {members.length >= 4 && <p className="text-xs text-yellow-500 mt-1">Auto-delete active (15m)</p>}
                                            </div>
                                            
                                            {isChatOpen ? (
                                                <>
                                                    <div className="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                                                        {chatMessages.map(msg => (
                                                            <div key={msg.id} className={`flex flex-col ${msg.author === currentUser.name ? 'items-end' : 'items-start'}`}>
                                                                <span className="text-[10px] text-gray-500 mb-1">{msg.author}</span>
                                                                <div className={`px-4 py-2 rounded-2xl max-w-[85%] break-words ${msg.author === currentUser.name ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-gray-800 text-gray-200 rounded-bl-sm'}`}>
                                                                    {msg.content}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="p-3 border-t border-gray-800 bg-black/40 rounded-b-2xl">
                                                        <form onSubmit={handleChat} className="flex gap-2">
                                                            <input 
                                                                type="text" 
                                                                value={chatInput}
                                                                onChange={e=>setChatInput(e.target.value)}
                                                                className="flex-1 bg-gray-900 border border-gray-700 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-blue-500"
                                                                placeholder="Type a message..."
                                                            />
                                                            <button type="submit" className="bg-blue-600 hover:bg-blue-500 p-2 rounded-full w-10 h-10 flex items-center justify-center transition-colors">
                                                                <MessageSquare className="w-4 h-4"/>
                                                            </button>
                                                        </form>
                                                    </div>
                                                </>
                                            ) : (
                                                <div className="flex-1 flex flex-col items-center justify-center p-6 text-center text-gray-500">
                                                    <MessageSquare className="w-12 h-12 mb-4 opacity-50"/>
                                                    <p>Chat is currently closed.</p>
                                                    <p className="text-sm mt-2">Come back between 6:00 PM and 11:00 PM.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* --- ADMIN TAB --- */}
                        {activeTab === 'Admin' && (
                            <div className="max-w-4xl mx-auto">
                                {!isAdminLoggedIn ? (
                                    <div className="glass p-8 rounded-2xl max-w-md mx-auto text-center border-red-500/30">
                                        <Shield className="w-16 h-16 mx-auto text-red-500 mb-4"/>
                                        <h2 className="text-2xl font-bold mb-6 text-red-400">Admin Authentication</h2>
                                        <form onSubmit={handleAdminLogin}>
                                            <input 
                                                type="password" 
                                                value={adminPassword}
                                                onChange={e=>setAdminPassword(e.target.value)}
                                                className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-center text-xl tracking-widest text-white mb-4 focus:border-red-500 focus:outline-none"
                                                placeholder="Enter Password"
                                                autoFocus
                                            />
                                            <button type="submit" className="w-full bg-red-600 hover:bg-red-700 py-3 rounded-lg font-bold transition-colors">Login to Dashboard</button>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center mb-8">
                                            <h2 className="text-3xl font-bold text-red-400 flex items-center gap-3"><Shield/> Admin Dashboard</h2>
                                            <button onClick={() => setIsAdminLoggedIn(false)} className="px-4 py-2 border border-red-500 text-red-500 rounded-lg hover:bg-red-500/10">Logout</button>
                                        </div>

                                        <div className="grid md:grid-cols-2 gap-6">
                                            {/* Manage Users */}
                                            <div className="glass p-5 rounded-2xl border-gray-800">
                                                <h3 className="text-xl font-bold mb-4 border-b border-gray-800 pb-2">Manage Users ({members.length})</h3>
                                                <div className="space-y-3 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                                                    {members.length === 0 && <p className="text-gray-500">No active users to manage.</p>}
                                                    {members.map(member => (
                                                        <div key={member.id} className="flex justify-between items-center bg-gray-900/50 p-3 rounded-lg">
                                                            <div className="flex items-center gap-3">
                                                                <img src={member.avatar} className="w-8 h-8 rounded-full bg-gray-800"/>
                                                                <span className="font-semibold">{member.name}</span>
                                                            </div>
                                                            <button onClick={() => kickMember(member.id)} className="text-red-500 hover:text-red-400 p-2 bg-red-500/10 rounded-lg" title="Kick User">
                                                                <UserMinus className="w-4 h-4"/>
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Manage Posts */}
                                            <div className="glass p-5 rounded-2xl border-gray-800">
                                                <h3 className="text-xl font-bold mb-4 border-b border-gray-800 pb-2">Manage Posts ({posts.length})</h3>
                                                <div className="space-y-3 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                                                    {posts.length === 0 && <p className="text-gray-500">No posts to manage.</p>}
                                                    {posts.map(post => (
                                                        <div key={post.id} className="bg-gray-900/50 p-3 rounded-lg">
                                                            <div className="flex justify-between items-start mb-2">
                                                                <span className="font-semibold text-sm">{post.author}</span>
                                                                <button onClick={() => deletePost(post.id)} className="text-red-500 hover:text-red-400 p-1 bg-red-500/10 rounded" title="Delete Post">
                                                                    <Trash2 className="w-3 h-3"/>
                                                                </button>
                                                            </div>
                                                            <p className="text-xs text-gray-400 truncate">{post.content}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                        
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
